services:
  api:
    build: .
    image: shortlink-service:local
    ports:
      - "8000:8000"
    environment:
      SHORTLINK_BASE_URL: "http://localhost:8000"
      SHORTLINK_VERSION: "compose"
    volumes:
      - shortlink-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  shortlink-data:
